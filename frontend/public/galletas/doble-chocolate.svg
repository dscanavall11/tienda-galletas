<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
  <radialGradient id="mesa" cx="50%" cy="44%" r="78%">
    <stop offset="0" stop-color="#fcfbf9"/><stop offset="1" stop-color="#d6d2ca"/>
  </radialGradient>
  <radialGradient id="masaGrad" cx="50%" cy="50%" r="58%" fx="40%" fy="36%">
    <stop offset="0" stop-color="#7a4a30"/><stop offset="0.72" stop-color="#5a321d"/><stop offset="1" stop-color="#3c2012"/>
  </radialGradient>
  <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="masa" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="warp"/>
    <feDisplacementMap in="SourceGraphic" in2="warp" scale="16" xChannelSelector="R" yChannelSelector="G" result="forma"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="28" result="grano"/>
    <feDiffuseLighting in="grano" lighting-color="#ffffff" surfaceScale="2.6" diffuseConstant="1.3" result="luz">
      <feDistantLight azimuth="235" elevation="56"/>
    </feDiffuseLighting>
    <feComposite in="luz" in2="forma" operator="in" result="luzForma"/>
    <feBlend in="forma" in2="luzForma" mode="multiply" result="textura"/>
    <feComposite in="textura" in2="forma" operator="in"/>
  </filter>
  <filter id="trozo" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="24" result="warp"/>
    <feDisplacementMap in="SourceGraphic" in2="warp" scale="8" xChannelSelector="R" yChannelSelector="G" result="forma"/>
    <feGaussianBlur in="forma" stdDeviation="0.9" result="suave"/>
    <feSpecularLighting in="suave" surfaceScale="3.2" specularConstant="1" specularExponent="22" lighting-color="#e8d5c4" result="brillo">
      <feDistantLight azimuth="235" elevation="52"/>
    </feSpecularLighting>
    <feComposite in="brillo" in2="forma" operator="in" result="brilloForma"/>
    <feComposite in="forma" in2="brilloForma" operator="arithmetic" k1="0" k2="1" k3="0.85" k4="0" result="conBrillo"/>
    <feDropShadow in="conBrillo" dx="1.6" dy="2.2" stdDeviation="1.6" flood-color="#000" flood-opacity="0.5"/>
  </filter>
  <filter id="relieve" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="1" dy="1.6" stdDeviation="1.1" flood-color="#000" flood-opacity="0.38"/>
  </filter>
</defs>
