<path d="M125.6,164.3L116.4,174.4L111.1,173.9L102.4,171.5L101.6,163L107.6,158.2L118.1,151.8L120.9,160.5Z" fill="#7a7a7a" filter="url(#trozo)"/>
<path d="M196.8,210.9L194.5,217L185.7,222.9L180,213.3L173,208L182.8,198.4L188.4,196.3L198.2,203.6Z" fill="#7a7a7a" filter="url(#trozo)"/>
<text x="200" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#80868b">Sin foto</text>
</svg>
